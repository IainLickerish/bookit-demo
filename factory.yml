# The sealed space for Software Factory build runs (see the factory's docs/spec.md).
# Integration and browser tests need Docker, so they run in CI, not in the sealed space.
image: node:24-bookworm
install:
  - npm install -g bun@1.4.4
  - curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
setup:
  - bun install --frozen-lockfile
checks:
  - bun run typecheck
  - bun run lint
  - bun run format:check
  - bun run test:unit
