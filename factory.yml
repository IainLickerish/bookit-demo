# BookIt's settings for the Software Factory (see the factory's docs/spec.md and decision 0051). The factory reads this
# file from the main version only, so a change cannot alter how it is built, checked or run.
# Browser tests need Docker, so they run in CI, not in the sealed space. The database tests run there too, against the
# test database below.
image: node:24-bookworm
install:
  - npm install -g bun@1.4.4
  - apt-get update && apt-get install -y --no-install-recommends jq && rm -rf /var/lib/apt/lists/*
  - curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
setup:
  - bun install --frozen-lockfile
checks:
  - bun run typecheck
  - bun run lint
  - bun run format:check
  - bun run test:unit

# A test database the factory starts beside its build run and its own checks (the factory's decision 0085), with a new
# random password each round. The database tests make a fresh database of their own on it (tests/helpers/database.ts);
# without the setting, as in CI, they start their own through Docker.
buildService:
  image: postgres:17-alpine
  env:
    POSTGRES_PASSWORD: '{password}'
  setting: BOOKIT_TEST_DATABASE_URL
  value: 'postgres://postgres:{password}@{host}:5432/postgres'
  checks:
    - bun run test:integration

# How to run one test file (the factory's decision 0116): the build run uses it while it works, and the factory uses it
# to run a bug fix's own tests on the main version.
testFile: bun run test {file}

# BookIt's own guidance, which every agent reads: its conventions, the product brief and the guides (the factory's
# decision 0099). The owner's privacy note (docs/owner/) is left out on purpose.
guidance:
  - AGENTS.md
  - docs/product.md
  - docs/guides/look-and-feel.md
  - docs/guides/user-experience.md
  - docs/guides/writing.md

# Which changes get a closer look: those that change stored data, and those always reviewed in full.
review:
  dataChanges:
    - drizzle/
  alwaysFull:
    - src/server/auth/
    - src/app/auth/
    - src/db/
    - drizzle/
    - package.json
    - bun.lock
    - Dockerfile
    - compose
    - infra/

# How the factory runs copies of BookIt: previews for the owner, and copies for the build run and the AI tester.
copies:
  # Taken from the main version, never from the change being tried.
  trusted:
    - compose.yml
    - scripts/init-database.sh
    - scripts/start-database.sh
    - scripts/local-proxy.mjs
  compose:
    - compose.yml
  frontDoor: web
  appPort: 3000
  mailPort: 8025
  mailNote: Mailpit; its API lists them at /api/v1/messages
  # Made-up test accounts (tenants/acme.json), behind the previews' own sign-in.
  password: try-bookit-demo
  accounts:
    - email: patient1@patients.acmephysio.test
      who: a client
    - email: patient2@patients.acmephysio.test
      who: a client with no phone number
    - email: patient3@patients.acmephysio.test
      who: another client with no phone number
    - email: admin@acmephysio.test
      who: clinic staff
  secrets:
    - database-password
    - postgres-password
  # The factory fills in the values in braces for each copy.
  env:
    BOOKIT_TENANT: acme
    BOOKIT_PRODUCT: ACME
    BOOKIT_ENV: local
    BOOKIT_MAIL_FROM: noreply@acmephysio.test
    BOOKIT_CREDENTIALS_DIR: '{credentials}'
    BOOKIT_PORT: '{port}'
    BOOKIT_MAIL_PORT: '{mailPort}'
    BOOKIT_PUBLIC_URL: '{publicUrl}'
    BOOKIT_LOCAL_IMAGE: '{image}'
